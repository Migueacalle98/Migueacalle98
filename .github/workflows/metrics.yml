name: Metrics

on:
  schedule:
    - cron: "0 6 * * *" # daily
  workflow_dispatch: # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Migueacalle98
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          filename: github-metrics.svg

          # Lines of code added/removed across repos the token can see
          # (private included). Aggregate only.
          plugin_lines: yes

          # Commit calendar across years; defaults to the current year.
          # Set plugin_calendar_limit: 0 for full history.
          plugin_calendar: yes

          # Steam profile and game activity.
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: ${{ secrets.STEAM_USER }}
